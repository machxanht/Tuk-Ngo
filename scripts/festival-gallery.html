<!doctype html><html><body style="margin:0"><script type="module">
import * as T from 'three';
import {loadFestivalCrowd,buildFestivalCrowd} from '../src/race/festival-crowd.mjs';
const scene=new T.Scene();scene.background=new T.Color('#bad9e8');scene.fog=new T.Fog('#bad9e8',110,430);
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;document.body.appendChild(renderer.domElement);
scene.add(new T.HemisphereLight('#e6efff','#bbab8c',2));const sun=new T.DirectionalLight('#fff3e4',2);sun.position.set(-10,30,-20);scene.add(sun);
const camera=new T.PerspectiveCamera(44,innerWidth/innerHeight,.1,1000);camera.position.set(3,2.4,8);camera.lookAt(0,1.1,15);
const ground=new T.Mesh(new T.PlaneGeometry(1700,100),new T.MeshStandardMaterial({color:'#c0b39b'}));ground.rotation.x=-Math.PI/2;ground.position.y=-.03;scene.add(ground);
const group=new T.Group();scene.add(group);const people=[];
for(let bank=0;bank<2;bank++)for(let row=0;row<10;row++)for(let n=0;n<1600;n++)people.push({x:(n-800)*.93,z:(bank?1:-1)*(15+row*.72),floor:0,id:bank*16000+row*1600+n,activity:n%37===0?'walk':n%23===0?'vendor':undefined,seated:row===8});
const assets=await loadFestivalCrowd('/Tuk-Ngo/');const crowd=buildFestivalCrowd(group,people,assets);window.gallery={scene,renderer,camera,crowd,assets,dense(){camera.position.set(0,18,-35);camera.lookAt(0,0,15);},close(){camera.position.set(3,2.4,8);camera.lookAt(0,1.1,15);}};
let time=0;function frame(){time+=1/60;crowd.update(time,camera.position.x,camera.position.z);renderer.render(scene,camera);requestAnimationFrame(frame);}frame();
</script></body></html>
